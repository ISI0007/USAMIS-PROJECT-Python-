[project]
name = "usamis-python"
version = "1.0.0"
description = "University Student Academic Management Information System (USAMIS) — Flask / PostgreSQL"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.0.7",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.2.1",
    "Flask-Limiter==3.8.0",
    "WTForms==3.1.2",
    "SQLAlchemy==2.0.35",
    "alembic==1.13.3",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.1",
    "Werkzeug==3.0.4",
    "email-validator==2.2.0",
    "numpy==2.1.3",
    "qrcode==8.2",
]

[project.optional-dependencies]
vision = ["opencv-python-headless==4.10.0.84", "Pillow==10.4.0"]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-flask==1.3.0",
    "python-pptx==1.0.2",
    "Pillow==10.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
